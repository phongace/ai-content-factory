[project]
name = "ai-content-factory"
version = "0.1.0"
description = "Internal AI content factory POC: topic -> storyboard -> voice -> scene clips -> subtitle -> render -> QC -> YouTube Shorts"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Media engine (MIT, see THIRD_PARTY_NOTICES.md). Pinned on purpose: we import a few internals.
    "mpt==1.3.8",
    "pydantic>=2.7,<3",
    "requests>=2.32",
    "streamlit==1.59.1",
    "google-api-python-client>=2.150,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
# Intel Macs: mpt -> faster-whisper -> onnxruntime dropped macOS x86_64 wheels after 1.23.x.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and the ASS style header are data; wrapping them would change their content.
"factory/planner.py" = ["E501"]
"factory/subtitles.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["media: spawns ffmpeg (slower)"]
